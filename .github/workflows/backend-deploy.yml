name: Backend Pipeline

on:
  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest httpx

      - name: Setup MyPy and Ruff Cache
        uses: actions/cache@v4
        with:
          path: |
            backend/.mypy_cache
            backend/.ruff_cache
          key: ${{ runner.os }}-python-cache-${{ hashFiles('backend/requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-python-cache-${{ hashFiles('backend/requirements.txt') }}-

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run MyPy Type Check
        run: mypy . --ignore-missing-imports

      - name: Run Pytest
        env:
          ENVIRONMENT: test
        run: pytest -v

  deploy:
    name: Deploy to Self-Hosted Server
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Setup SSH Configuration
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat >> ~/.ssh/config << 'EOF'
          Host tunnel-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Deploy Application via SSH
        run: |
          ssh tunnel-server << 'EOF'
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            echo "=== 更新程式碼庫 ==="
            git fetch origin master
            git reset --hard origin/master

            echo "=== 更新後端 Python 依賴 ==="
            if [ -f "backend/.venv/bin/pip" ]; then
              ./backend/.venv/bin/pip install -r backend/requirements.txt
            else
              echo "找不到虛擬環境，請確認 backend/.venv 是否存在"
              exit 1
            fi

            echo "=== 重啟系統服務 ==="
            sudo systemctl restart ncu-backend

            echo "=== 部署完成 ==="
          EOF